<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Kitten Landing Page</title>
    <style>
        body {
            background-color: #fffaf0; /* Soft floral white */
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #5d4037; /* Warm brown */
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 700px;
        }
        h1 {
            color: #ff8a65; /* Peach/Orange */
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            border: 8px solid #ffe0b2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Kitten Club!</h1>
        <p>Meet our newest member, the fluffiest orange kitten you've ever seen.</p>
        <img src="https://placecats.com/600/400" alt="A cute fluffy orange kitten playing with a toy mouse">
    </div>
</body>
</html>
